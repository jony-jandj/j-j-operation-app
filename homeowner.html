<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>J&J · Your Selections</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#14234a;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}header{background:#14234a;color:white;padding:20px}button,input,textarea{font:inherit}button{padding:12px;border:0;border-radius:8px;background:#14234a;color:white;cursor:pointer}button:disabled{opacity:.5}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article,form{padding:20px;background:white;border:1px solid #d9dce2;border-radius:12px;margin:16px 0}article.chosen{border:3px solid #2e7a55}.badge{color:#246441;font-weight:700}img{width:100%;height:180px;object-fit:contain}input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin:6px 0 14px}label{display:block}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.detail{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#14234a}#message{padding:16px;background:#fff3d8}h1{font-size:24px}h2{font-size:20px}small{display:block;color:#657080;margin:8px 0}
</style></head><body><header>J&J Home Renovations · Homeowner Selections</header><main><h1 id="job">Your selections</h1><p>Add product details or mark a Pending product as Selected.</p><p id="message" role="status">Opening your private link…</p><button id="refresh" hidden>Refresh selections</button><div id="items"></div><form id="add" hidden><h2>Add a product</h2><div class="fields"><label>Product name<input name="title" required maxlength="200"></label><label>Room<input name="room" maxlength="150"></label><label>Category<input name="category" maxlength="100"></label><label>Vendor<input name="vendor" maxlength="200"></label><label>Model / SKU<input name="model" maxlength="200"></label><label>Quantity<input name="quantity" type="number" min="1" max="10000" step="any" value="1"></label></div><label>Product link<input name="url" type="url" maxlength="2000"></label><label>Description / finish / color<textarea name="description" rows="4" maxlength="4000"></textarea></label><small>New products are marked Pending and Purchased by Homeowner. Please leave prices out of product details.</small><button>Add product</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const token=new URLSearchParams(location.hash.slice(1)).get('key')||'';
const client=window.supabase?.createClient('https://mrkvspqwqsmlnhrfllpx.supabase.co','sb_publishable_n5w6Q2b1nvsnOEcYZL2fsQ_u0gGltVk',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const msg=document.getElementById('message');let busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
async function refresh(){
 if(!client){msg.textContent='Unable to connect. Check your connection and refresh.';return;}
 if(!/^[a-f0-9]{64}$/.test(token)){msg.textContent='Open the private QR code or link provided by J&J.';return;}
 const {data,error}=await client.rpc('jj_portal_read',{p_token:token});
 if(error){msg.textContent='This link is unavailable. Ask J&J to check or replace it.';document.getElementById('items').replaceChildren();document.getElementById('add').hidden=true;return;}
 document.getElementById('job').textContent=data.jobName+' · Selections';msg.textContent='Your selections are up to date.';
 document.getElementById('items').innerHTML=data.items.map(i=>`<article class="${i.homeownerSelected?'chosen':''}">${safe(i.image)?`<img referrerpolicy="no-referrer" src="${esc(safe(i.image))}" alt="${esc(i.title)}">`:''}<small>${esc(i.room)} · ${esc(i.category)}</small><h2>${esc(i.title)}</h2>${i.homeownerSelected?'<p class="badge">H.O. has selected</p>':''}<p class="detail">${esc(i.description)}</p><small>${esc(i.vendor)} ${esc(i.model)}</small><p>Quantity: ${esc(i.quantity||1)}</p><p><b>Purchased by:</b> ${esc(i.purchasedBy||'Not assigned')}</p><p>Status: ${esc(i.status)}</p>${safe(i.url)?`<p><a href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">View product</a></p>`:''}${i.status==='Pending'?`<button data-select="${esc(i.id)}">Mark Selected</button>`:''}</article>`).join('')||'<p>No selections yet. Add your first product below.</p>';
 document.getElementById('add').hidden=false;document.getElementById('refresh').hidden=false;
}
async function write(action,item){
 if(busy)return false;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{const {error}=await client.rpc('jj_portal_write',{p_token:token,p_action:action,p_item:item});if(error)throw error;await refresh();return true;}catch(e){msg.textContent=e.message||'Could not save. Please try again.';return false;}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}
}
document.getElementById('items').addEventListener('click',e=>{const b=e.target.closest('[data-select]');if(b)write('select',{id:b.dataset.select});});
document.getElementById('add').addEventListener('submit',async e=>{e.preventDefault();if(await write('add',Object.fromEntries(new FormData(e.target))))e.target.reset();});
document.getElementById('refresh').onclick=refresh;refresh();
</script></body></html>
